name: Yank

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to yank
        required: true
        type: string

jobs:
  yank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Yank version
        run: cargo yank --version "${{ inputs.version }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
