name: Generate Used By Cards

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-used-by-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate used by assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_used_by.py --config .github/used-by-repositories.json --output docs/used_by

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/used_by
          if ! git diff --cached --quiet; then
            git commit -m "chore: update used by cards"
            git push
          fi
