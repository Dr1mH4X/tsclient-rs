[package]
name = "tsclient-rs"
version = "0.0.0"
description = "TeamSpeak 3/5/6 client protocol library"
license = "MIT"
repository = "https://github.com/dreamhax/tsclient-rs"
edition = "2024"

[features]
default = []
open-protocol = ["dep:serde", "dep:serde_json"]
stream = ["dep:serde", "dep:serde_json"]

[dependencies]
thiserror = "2"
bytes = "1"
tokio = { version = "1", features = ["net", "time", "rt", "macros", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# crypto
aes = "0.8"
ctr = "0.9"
cmac = "0.7"
cipher = "0.4"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
ed25519-dalek = "2"
curve25519-dalek = "4"
p256 = { version = "0.13", features = ["ecdh", "pem", "ecdsa"] }
x25519-dalek = "2"
rsa = "0.9"
der = "0.7"
rand = "0.8"
num-bigint = "0.4"
base64 = "0.22"
sha1 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }

# dns
hickory-resolver = "0.26.2"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# logging
tracing = "0.1"

[[example]]
name = "open_protocol_bot"
required-features = ["open-protocol"]
